name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, uji, evaluasi dapat diulang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Uji (termasuk hitung ulang evaluasi dan cocokkan dengan eval/results.json)
        run: pytest --cov=evidence --cov-report=term-missing
      - name: Data situs konsisten dengan hasil evaluasi
        run: |
          evidence export
          git diff --exit-code -- web/public/data

  web:
    name: Website (uji, pemeriksaan build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  sumber-resmi:
    name: Sumber resmi (SHA-256 dokumen dan korpus)
    runs-on: ubuntu-latest
    # JDIH kadang lambat atau menolak runner; kegagalan di sini tidak menggagalkan PR,
    # tetapi tetap terlihat. Dijalankan terjadwal dan manual agar tidak memperlambat tiap PR.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: evidence data fetch
      - name: Bangun ulang korpus dan bandingkan dengan yang tercatat
        run: |
          evidence build
          git diff --exit-code -- corpus/korpus.json
