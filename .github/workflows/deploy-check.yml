name: Periksa situs terbit

# Dijalankan manual setelah Cloudflare Pages selesai deploy.
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL situs
        required: true
        default: https://industrial-evidence-copilot.pages.dev/

permissions:
  contents: read

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_published.py "${{ inputs.url }}"
