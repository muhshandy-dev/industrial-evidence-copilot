name: Eksperimen prompt

# Membandingkan kandidat prompt di data DEV saja (pertanyaan yang lolos gerbang), dengan model
# utama 1,5B dan model CPU 0,5B, lalu menilai kalimat dengan NLI. Aturan pilih ditulis di
# src/evidence/generation.py (choose_prompt) sebelum hasil terlihat. Data test, injeksi, dan
# set tersegel tidak dipakai di sini.
on:
  # Push hanya mendaftarkan workflow dan memeriksa masukan; generasi hanya lewat dispatch.
  push:
    branches-ignore: [main]
    paths: [".github/workflows/eksperimen-prompt.yml"]
  workflow_dispatch:
    inputs:
      varian:
        description: "Kandidat prompt yang dibangkitkan (bertahan sudah ada di cache)"
        default: "k1,k2,k3,k4"
      model:
        description: "Model: utama, cpu, qwen3-1.7b, qwen3-4b (dipisah koma)"
        default: "utama,cpu"
      shards:
        description: "Jumlah shard paralel"
        default: "8"

permissions:
  contents: write

concurrency:
  group: eksperimen-prompt-${{ github.ref }}
  cancel-in-progress: false

env:
  VARIAN: ${{ inputs.varian || 'k1,k2,k3,k4' }}
  MODEL: ${{ inputs.model || 'utama,cpu' }}
  SHARDS: ${{ inputs.shards || '8' }}

jobs:
  siapkan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: evidence gen-input --set dev --out masukan.jsonl && wc -l masukan.jsonl
      - id: m
        run: echo "shards=$(python -c "import json;print(json.dumps(list(range(int('$SHARDS')))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: masukan
          path: masukan.jsonl

  bangkitkan:
    needs: siapkan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.siapkan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: web
      - uses: actions/cache@v4
        with:
          path: web/node_modules/@huggingface/transformers/.cache
          key: tjs-${{ hashFiles('web/public/js/gen/prompt.js') }}
          restore-keys: tjs-
      - uses: actions/download-artifact@v4
        with:
          name: masukan
          path: web
      - name: Bangkitkan kandidat
        working-directory: web
        run: |
          for v in ${VARIAN//,/ }; do
            for m in ${MODEL//,/ }; do
              node scripts/generate.mjs --in masukan.jsonl --out keluaran.jsonl --varian "$v" --model "$m" \
                --lolos --shard ${{ matrix.shard }} --shards "$SHARDS"
            done
          done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nli-${{ hashFiles('src/evidence/generation.py') }}
          restore-keys: hf-
      - name: NLI untuk keluaran shard ini
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[model]"
          evidence gen-merge web/keluaran.jsonl
          K=$(python -c "import os;v=os.environ['VARIAN'].split(',');m=os.environ['MODEL'].split(',');s={'utama':'','cpu':'-cpu'};print(','.join(x+s.get(y,'-'+y) for x in v for y in m))")
          evidence nli --konfigurasi "$K" --out nli.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keluaran-${{ matrix.shard }}
          path: |
            web/keluaran.jsonl
            nli.json
          if-no-files-found: ignore

  gabung:
    needs: bangkitkan
    if: always() && github.event_name == 'workflow_dispatch' && needs.bangkitkan.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          pattern: keluaran-*
          path: keluaran
      - run: |
          ls -R keluaran | head -40
          evidence gen-merge keluaran/*/web/keluaran.jsonl
          evidence nli-merge keluaran/*/nli.json
          evidence gen-eksperimen --varian bertahan,k1,k2,k3,k4
      - name: Commit hasil ke cabang ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/cache/gen eval/cache/nli eval/eksperimen-prompt.json
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "Eksperimen prompt (dev): keluaran kandidat, skor NLI, ringkasan"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
