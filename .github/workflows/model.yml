name: Model

# Tahap yang butuh model dari Hugging Face: embedding, reranker, dan (nanti) generator.
# Hasilnya disimpan di eval/cache/ dan di-commit ke cabang yang sama, sehingga evaluasi
# biasa (CI) dapat diulang tanpa mengunduh model.
on:
  workflow_dispatch:
    inputs:
      tahap:
        description: "embed, rerank, atau semua"
        required: true
        default: semua

permissions:
  contents: write

concurrency:
  group: model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/evidence/dense.py', 'src/evidence/rerank.py') }}
          restore-keys: hf-
      - name: Pasang dependensi (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,model]"
      - name: Embedding
        if: inputs.tahap == 'embed' || inputs.tahap == 'semua'
        run: evidence embed
      - name: Reranker
        if: inputs.tahap == 'rerank' || inputs.tahap == 'semua'
        run: evidence rerank
      - name: Evaluasi dan ekspor
        run: |
          evidence eval
          evidence export
          pytest -q
      - name: Commit hasil ke cabang ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/cache eval/results.json web/public/data
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "Model: perbarui cache (${{ inputs.tahap }}) dan hasil evaluasi"
          git push
