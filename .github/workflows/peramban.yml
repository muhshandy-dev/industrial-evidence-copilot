name: Peramban generatif

# Uji asap mode generatif di Chromium sungguhan (unduh model dari Hugging Face, WebGPU
# perangkat lunak di runner). Lambat, jadi tidak ikut CI biasa.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/peramban.yml"
      - "web/tests/gen-browser.mjs"
      - "web/tests/wasm-probe.mjs"
      - "web/public/js/gen/**"
      - "web/scripts/paritas-rerank.mjs"
  workflow_dispatch:
    inputs:
      calon:
        description: "Percobaan CPU: daftar model:dtype dipisah koma (kosong = uji asap biasa)"
        default: ""

permissions:
  contents: read

jobs:
  peramban:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Percobaan model di CPU peramban
        if: inputs.calon != ''
        env:
          CALON: ${{ inputs.calon }}
        run: node tests/wasm-probe.mjs
        continue-on-error: true
      - name: Paritas reranker (transformers.js di Node terhadap skor evaluasi)
        run: node scripts/paritas-rerank.mjs
      - name: Uji asap mode generatif
        run: node tests/gen-browser.mjs
