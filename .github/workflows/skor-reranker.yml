name: Skor reranker 8-bit

# Menilai pasangan (pertanyaan, pasal) dari cache fp32 dengan reranker 8-bit memakai kode situs,
# lalu meng-commit eval/cache/rerank/mminilm_q8/skor.json. Metriknya dihitung `evidence eval`.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/skor-reranker.yml"
      - "web/scripts/skor-rerank.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skor-reranker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  skor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node scripts/skor-rerank.mjs
        working-directory: web
      - name: Commit skor ke cabang ini
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/cache/rerank/mminilm_q8
          if git diff --cached --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "Skor reranker 8-bit dengan kode situs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
