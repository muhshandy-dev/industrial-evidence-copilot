[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-evidence-copilot"
version = "0.1.0"
description = "Tanya-jawab dengan kutipan yang dapat diperiksa atas peraturan K3 Indonesia, dengan evaluasi retrieval dan jawaban yang dapat direproduksi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pdfplumber>=0.11",
    "pypdf>=4",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Tahap model (embedding, reranker, generator): dijalankan di GitHub Actions.
model = ["sentence-transformers==6.2.0", "transformers>=4.46", "torch"]

[project.scripts]
evidence = "evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
